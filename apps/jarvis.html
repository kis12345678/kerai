<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Jarvis – Web Voice Assistant</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#222;color:#eee;display:flex;flex-direction:column;height:100vh;margin:0}
#chat{flex:1;padding:10px;overflow:auto}
.message{margin-bottom:8px}
.user{text-align:right}
.system{color:#4ec9b0}
.btns{padding:5px 10px;background:#444;color:white;border:none;border-radius:4px;margin-right:5px;cursor:pointer}
#status{font-size:12px;padding:5px;text-align:center;background:#111;color:#bbb}
</style>
</head>
<body>
<div id="chat"></div>
<div id="status">Press <strong>Start Listening</strong> and say “Jarvis” to activate.</div>
<script>
const chat = document.getElementById('chat');
const status = document.getElementById('status');
let recognition;
function addMessage(text, type='system'){const div=document.createElement('div');div.className=`message ${type}`;div.textContent=text;chat.appendChild(div);chat.scrollTop=chat.scrollHeight;}

// Set up SpeechRecognition if supported
if('SpeechRecognition' in window || 'webkitSpeechRecognition' in window){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.continuous=true;recognition.lang='en-US';recognition.interimResults=false;
  recognition.onresult=evt=>{const transcript=String(evt.results[0][0].transcript).trim().toLowerCase();handleCommand(transcript);}
  recognition.onerror=e=>{addMessage('Error: '+e.error,'system');status.textContent='Listening error – try again.';stopListening();}
}else{
  addMessage('Your browser does not support the Web Speech API.','system');status.style.display='none';
}

function startListening(){
  if(!recognition)return;
  recognition.start();status.textContent='Listening… Say “Jarvis” to activate.';addMessage('Speech recognition started.','system');}
function stopListening(){if(recognition)recognition.stop();}

// Simple command handler
const commands=[
  {regex:/\bhello jarvis\b/gi, action:()=>addMessage('Hello! How can I help you today?', 'system')},
  {regex:/time/i, action:()=>{const now=new Date();addMessage(`Current time is ${now.toLocaleTimeString()}`,'system')} },
  {regex:/date/i, action:()=>{const now=new Date();addMessage(`Today's date is ${now.toDateString()}`,'system')} },
  {regex:/weather in (.+)/i, action:(m)=>fetchWeather(m[1].trim())},
  {regex:/open google/i, action:()=>openUrl('https://www.google.com')},
  {regex:/how are you/i, action:()=>addMessage('I am a collection of code and would love to help you', 'system')} ,
];

function handleCommand(text){
  addMessage(`> ${text}`, 'user');
  if(!text.includes('jarvis')){status.textContent='Say “Jarvis” to activate.';return;}
  const cleaned= text.replace(/jarvis/,'').trim();
  for(const cmd of commands){const m=cleaned.match(cmd.regex);if(m){cmd.action(m);break;}}
}

async function fetchWeather(city){try{addMessage(`Fetching weather for ${city}…`, 'system');const res=await fetch('https://wttr.in/'+encodeURIComponent(city)+'?format=j1');const data=await res.json();const temp=data.current_condition[0].temp_C+"°C "+data.current_condition[0].weatherDesc[0].value;addMessage(`Weather in ${city}: ${temp}`, 'system');}catch(e){addMessage('Could not fetch weather.', 'system');}}

function openUrl(url){window.open(url,'_blank');}

// Buttons for manual start/stop
const btnDiv=document.createElement('div');btnDiv.style.position='fixed';btnDiv.style.bottom='10px';btnDiv.style.left='50%';btnDiv.style.transform='translateX(-50%)';btnDiv.innerHTML=`<button class="btns" id="startBtn">Start Listening</button><button class="btns" id="stopBtn">StopListening</button>`;document.body.appendChild(btnDiv);

document.getElementById('startBtn').addEventListener('click', startListening);
document.getElementById('stopBtn').addEventListener('click', stopListening);

// Auto-start after 2s to test?
setTimeout(()=>{if(recognition)recognition.start();},2000);
</script>
</body>
</html>
