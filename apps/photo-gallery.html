<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Photo Gallery</title>
<style>
body{font-family:sans-serif;margin:0;background:#f9f9f9;display:flex;justify-content:center}#gallery{max-width:1200px;width:100%;padding:20px}
.grid{display:grid;grid-template-columns:auto auto auto;gap:10px}
.grid img{width:100%;height:auto;border-radius:5px;cursor:pointer;transition:transform .3s,box-shadow .3s}
.grid img:hover{transform:scale(1.05);box-shadow:0 4px 15px rgba(0,0,0,.2)}.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:.3s}
.lightbox.open{visibility:visible;opacity:1}.lightbox img{max-width:90%;max-height:80%;border-radius:5px} .close{position:absolute;top:20px;right:20px;color:#fff;font-size:2rem;cursor:pointer}
@media(max-width:900px){.grid{grid-template-columns:auto auto}}
@media(max-width:600px){.grid{grid-template-columns:auto}}
</style>
</head>
<body>
<div id="gallery">
<h1 style="text-align:center">Photo Gallery</h1>
<div class="grid">
<img src="https://picsum.photos/id/1018/400/300" alt="Gallery photo 1" />
<img src="https://picsum.photos/id/1025/400/300" alt="Gallery photo 2" />
<img src="https://picsum.photos/id/1037/400/300" alt="Gallery photo 3" />
<img src="https://picsum.photos/id/1041/400/300" alt="Gallery photo 4" />
<img src="https://picsum.photos/id/1069/400/300" alt="Gallery photo 5" />
<img src="https://picsum.photos/id/1084/400/300" alt="Gallery photo 6" />
</div>
</div>
<div class="lightbox" id="lb">
<span class="close" style="position:absolute;top:20px;right:20px;font-size:2rem;color:#fff;cursor:pointer">&times;</span>
<img src="" alt="Full view" />
</div>
<script>
const imgs=document.querySelectorAll('.grid img');const lb=document.getElementById('lb');const lbImg=lb.querySelector('img');imgs.forEach(img=>img.addEventListener('click',()=>{lb.classList.add('open');lbImg.src=img.src;}));lb.addEventListener('click',(e)=>{if(e.target===lb||e.target.className==='close')lb.classList.remove('open');});
</script>
</body>
</html>
