<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Ultimate Photo Gallery</title>
<style>
/* Basic reset */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;background:#f4f4f4;color:#333;padding:20px 0;display:flex;justify-content:center;align-items:flex-start;height:100vh;overflow-y:auto;}
.gallery-container{width:90%;max-width:1200px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;padding-bottom:20px;}
.card{background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.1);transition:transform .3s ease, box-shadow .3s ease;cursor:pointer;display:flex;flex-direction:column;}
.card:hover{transform:translateY(-5px);box-shadow:0 4px 12px rgba(0,0,0,.15);}/* Image */
.card img{width:100%;height:150px;object-fit:cover;transition:transform .3s ease;} 
.card:hover img{transform:scale(1.05);} /* Footer with title*/
.card-content{padding:10px;font-size:.9rem;flex-grow:1;display:flex;align-items:center;justify-content:center;text-align:center;}
@media (max-width:600px){.card img{height:120px;} }
</style>
</head>
<body>
<div class="gallery-container" id="gallery"></div>
<script>
// Array of image URLs (Unsplash placeholder)
const images = [
  'https://source.unsplash.com/random/800x600?sig=1',
  'https://source.unsplash.com/random/800x601?sig=2',
  'https://source.unsplash.com/random/800x602?sig=3',
  'https://source.unsplash.com/random/800x603?sig=4',
  'https://source.unsplash.com/random/800x604?sig=5',
  'https://source.unsplash.com/random/800x605?sig=6',
  'https://source.unsplash.com/random/800x606?sig=7',
  'https://source.unsplash.com/random/800x607?sig=8',
  'https://source.unsplash.com/random/800x608?sig=9',
  'https://source.unsplash.com/random/800x609?sig=10',
  'https://source.unsplash.com/random/800x610?sig=11',
  'https://source.unsplash.com/random/800x611?sig=12',
  'https://source.unsplash.com/random/800x612?sig=13',
  'https://source.unsplash.com/random/800x613?sig=14',
  'https://source.unsplash.com/random/800x614?sig=15',
  'https://source.unsplash.com/random/800x615?sig=16',
  'https://source.unsplash.com/random/800x616?sig=17',
  'https://source.unsplash.com/random/800x617?sig=18',
  'https://source.unsplash.com/random/800x618?sig=19',
  'https://source.unsplash.com/random/800x619?sig=20'
];

const gallery = document.getElementById('gallery');
images.forEach((src,i)=>{
  const card=document.createElement('div');card.className='card';
  const img=document.createElement('img');img.src=src; img.alt=`Photo ${i+1}`;
  const content=document.createElement('div');content.className='card-content';content.textContent=`Photo ${i+1}`;
  card.append(img,content);
  gallery.append(card);
});
</script>
</body>
</html>
